[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_sqlite", "php83Extensions.sqlite3", "php83Extensions.mbstring", "php83Extensions.tokenizer", "php83Extensions.xml", "php83Extensions.ctype", "php83Extensions.fileinfo", "php83Extensions.openssl", "php83Extensions.bcmath", "php83Extensions.json", "composer"]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader"]

[start]
cmd = "touch database/database.sqlite && php artisan key:generate --force && php artisan config:clear && php artisan route:clear && php artisan migrate:fresh --seed --force && php -d variables_order=EGPCS -S 0.0.0.0:${PORT:-8080} -t public/ public/index.php"
